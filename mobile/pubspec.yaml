name: novarise_mail
description: Secure first-party mobile client for Novarise mailboxes.
publish_to: none
version: 1.1.1+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.3
  flutter_local_notifications: ^19.0.0
  flutter_widget_from_html_core: ^0.17.3
  flutter_secure_storage: ^10.0.0
  http: ^1.5.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/novarise-icon-mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/novarise-icon-mark.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/novarise-icon-mark.png
  min_sdk_android: 24
  remove_alpha_ios: true
