name: Backend tests

# Runs the whole backend suite, including the NovaFin accounting tests that need a real
# PostgreSQL (row locks and ledger triggers are the point), on every push and pull request.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novarise
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: novarise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novarise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://novarise:ci-only-password@localhost:5432/novarise
      NOVAFIN_TEST_DATABASE_URL: postgresql+psycopg://novarise:ci-only-password@localhost:5432/novarise
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build the database from the migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
