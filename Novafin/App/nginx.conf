server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web (hash-based routing, no custom UrlStrategy set) never
    # needs a server-side SPA rewrite - every route after the # fragment
    # is client-side only - but this fallback is harmless and protects
    # against a future switch to usePathUrlStrategy().
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app bundle keeps the same file name on every release, so it must be
    # revalidated each load (ETag keeps this cheap); otherwise browsers keep an
    # old build for up to 30 days after a deploy.
    location ~* \.(?:js|json|wasm)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
